<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 110" fill="none">
  <title>Flight Attendant Scarf</title>

  <!-- Left back drape (under) -->
  <path d="M 38 8 Q 60 32, 124 54 L 130 78 Q 86 60, 48 36 Z"
        fill="#8a2531"/>
  <!-- Left front drape -->
  <path d="M 44 6 Q 68 30, 128 52 L 132 72 Q 88 56, 54 32 Z"
        fill="#c0394a"/>
  <!-- Left highlight stripe -->
  <path d="M 52 12 Q 76 30, 126 48 L 128 56 Q 80 42, 60 24 Z"
        fill="#f5f3ed" opacity="0.55"/>

  <!-- Right back drape (under) -->
  <path d="M 242 8 Q 220 32, 156 54 L 150 78 Q 194 60, 232 36 Z"
        fill="#8a2531"/>
  <!-- Right front drape -->
  <path d="M 236 6 Q 212 30, 152 52 L 148 72 Q 192 56, 226 32 Z"
        fill="#c0394a"/>
  <!-- Right highlight stripe -->
  <path d="M 228 12 Q 204 30, 154 48 L 152 56 Q 200 42, 220 24 Z"
        fill="#f5f3ed" opacity="0.55"/>

  <!-- Central knot at the throat -->
  <ellipse cx="140" cy="55" rx="18" ry="13" fill="#7e1e2a"/>
  <ellipse cx="140" cy="52" rx="16" ry="11" fill="#c0394a"/>
  <!-- Knot highlight -->
  <ellipse cx="136" cy="49" rx="6" ry="3" fill="#f5f3ed" opacity="0.35"/>
  <!-- Knot fold lines -->
  <path d="M 125 50 Q 134 47, 142 52" stroke="#7e1e2a" stroke-width="1" fill="none"/>
  <path d="M 138 47 Q 146 49, 155 55" stroke="#7e1e2a" stroke-width="1" fill="none"/>

  <!-- Loose end (left) hanging from knot -->
  <path d="M 128 65 Q 124 80, 122 98 L 134 100 Q 136 82, 138 67 Z"
        fill="#c0394a"/>
  <path d="M 122 98 L 128 104 L 134 100"
        stroke="#f5f3ed" stroke-width="1" fill="none"/>

  <!-- Loose end (right) hanging from knot -->
  <path d="M 152 65 Q 156 80, 158 98 L 146 100 Q 144 82, 142 67 Z"
        fill="#c0394a"/>
  <path d="M 158 98 L 152 104 L 146 100"
        stroke="#f5f3ed" stroke-width="1" fill="none"/>

  <!-- Decorative pattern dots (white) -->
  <g opacity="0.55" fill="#f5f3ed">
    <circle cx="72"  cy="22" r="1.3"/>
    <circle cx="86"  cy="30" r="1.3"/>
    <circle cx="100" cy="38" r="1.3"/>
    <circle cx="114" cy="44" r="1.3"/>
    <circle cx="80"  cy="42" r="1"/>
    <circle cx="94"  cy="50" r="1"/>

    <circle cx="208" cy="22" r="1.3"/>
    <circle cx="194" cy="30" r="1.3"/>
    <circle cx="180" cy="38" r="1.3"/>
    <circle cx="166" cy="44" r="1.3"/>
    <circle cx="200" cy="42" r="1"/>
    <circle cx="186" cy="50" r="1"/>
  </g>
</svg>
