<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <title>Smartphone (balanced on head)</title>

  <!-- Subtle shadow under the phone where it meets the head -->
  <ellipse cx="120" cy="142" rx="40" ry="3.5" fill="#000" opacity="0.18"/>

  <!-- Phone body -->
  <rect x="88" y="18" width="64" height="124" rx="9" ry="9" fill="#16181d"/>
  <rect x="88" y="18" width="64" height="124" rx="9" ry="9" fill="none" stroke="#2a2d35" stroke-width="0.8"/>

  <!-- Screen -->
  <rect x="93" y="25" width="54" height="106" rx="4.5" ry="4.5" fill="#e9ecf2"/>

  <!-- Top dynamic island / notch -->
  <rect x="112" y="29" width="16" height="3.8" rx="1.9" fill="#0a0b0e"/>

  <!-- Status bar (time + icons hint) -->
  <rect x="97" y="36" width="8" height="2" rx="1" fill="#999fae"/>
  <rect x="135" y="36" width="7" height="2" rx="1" fill="#999fae"/>

  <!-- Feed: post 1 -->
  <circle cx="100" cy="46" r="3" fill="#c9d0dd"/>
  <rect x="106" y="44" width="28" height="1.8" rx="0.9" fill="#3a4250"/>
  <rect x="106" y="47.5" width="20" height="1.5" rx="0.7" fill="#9ba3b3"/>
  <rect x="97" y="52" width="46" height="9" rx="1.5" fill="#dfe4ee"/>

  <!-- heart + reactions row -->
  <path d="M 99 64 q -1 -1.5, -2 0 q -1 1.5, 1.5 3 q 2.5 -1.5, 1.5 -3 q -1 -1.5, -2 0 Z" fill="#e63946"/>
  <circle cx="105" cy="64.5" r="0.9" fill="#9ba3b3"/>
  <circle cx="108" cy="64.5" r="0.9" fill="#9ba3b3"/>

  <!-- Feed: post 2 -->
  <circle cx="100" cy="74" r="3" fill="#c9d0dd"/>
  <rect x="106" y="72" width="30" height="1.8" rx="0.9" fill="#3a4250"/>
  <rect x="106" y="75.5" width="22" height="1.5" rx="0.7" fill="#9ba3b3"/>
  <rect x="97" y="80" width="46" height="9" rx="1.5" fill="#dfe4ee"/>
  <!-- play triangle on the post (suggests video) -->
  <circle cx="120" cy="84.5" r="2.5" fill="#16181d" opacity="0.4"/>
  <path d="M 119 83.3 L 121.3 84.5 L 119 85.7 Z" fill="#fff"/>

  <!-- Feed: post 3 (cut off, hints at infinite scroll) -->
  <circle cx="100" cy="100" r="3" fill="#c9d0dd"/>
  <rect x="106" y="98" width="26" height="1.8" rx="0.9" fill="#3a4250"/>
  <rect x="106" y="101.5" width="28" height="1.5" rx="0.7" fill="#9ba3b3"/>
  <rect x="97" y="106" width="46" height="14" rx="1.5" fill="#dfe4ee"/>

  <!-- Bottom nav bar -->
  <rect x="93" y="123" width="54" height="6" fill="#f4f6fa"/>
  <circle cx="102" cy="126" r="1.5" fill="#16181d"/>
  <circle cx="111" cy="126" r="1.5" fill="#9ba3b3"/>
  <circle cx="120" cy="126" r="1.5" fill="#9ba3b3"/>
  <circle cx="129" cy="126" r="1.5" fill="#9ba3b3"/>
  <circle cx="138" cy="126" r="1.5" fill="#9ba3b3"/>

  <!-- Home indicator -->
  <rect x="110" y="135" width="20" height="2" rx="1" fill="#3a4250"/>

  <!-- Notification badge (red dot, top-right) -->
  <circle cx="146" cy="28" r="3.8" fill="#e63946"/>
  <text x="146" y="30.8" font-size="5" font-family="Inter, sans-serif" font-weight="700" fill="#fff" text-anchor="middle">9</text>
</svg>
