<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 170" fill="none">
  <title>Outdoorsy Bucket Hat</title>
  <!-- Wide floppy brim (back layer) -->
  <ellipse cx="130" cy="125" rx="125" ry="22" fill="#7d6a48"/>
  <!-- Brim top layer -->
  <ellipse cx="130" cy="120" rx="125" ry="20" fill="#9a8662"/>

  <!-- Crown (top of hat) -->
  <path d="M 60 122 Q 52 55, 130 50 Q 208 55, 200 122 Z" fill="#a89272"/>

  <!-- Top highlight -->
  <ellipse cx="124" cy="68" rx="58" ry="11" fill="#bda685" opacity="0.7"/>

  <!-- Hat band -->
  <path d="M 62 112 Q 130 128, 198 112 L 196 122 Q 130 138, 64 122 Z" fill="#4d3f26"/>

  <!-- Band buckle/strap detail -->
  <rect x="142" y="116" width="10" height="6" rx="1" fill="#b8932f"/>

  <!-- Stitch line along brim -->
  <path d="M 18 125 Q 130 142, 242 125" stroke="#5d4f33" stroke-width="0.8" stroke-dasharray="3 4" fill="none" opacity="0.5"/>

  <!-- Tiny pine sprig pinned on side -->
  <g transform="translate(78, 95) rotate(-25)">
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#3d5232" stroke-width="1.5"/>
    <line x1="0" y1="-3" x2="-4" y2="-6" stroke="#3d5232" stroke-width="1.2"/>
    <line x1="0" y1="-3" x2="4" y2="-6" stroke="#3d5232" stroke-width="1.2"/>
    <line x1="0" y1="-7" x2="-5" y2="-10" stroke="#3d5232" stroke-width="1.2"/>
    <line x1="0" y1="-7" x2="5" y2="-10" stroke="#3d5232" stroke-width="1.2"/>
    <line x1="0" y1="-11" x2="-3" y2="-13" stroke="#3d5232" stroke-width="1.2"/>
    <line x1="0" y1="-11" x2="3" y2="-13" stroke="#3d5232" stroke-width="1.2"/>
  </g>
</svg>
