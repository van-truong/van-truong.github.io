<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <title>World Globe</title>

  <!-- ───────── Wooden base ───────── -->
  <ellipse cx="140" cy="210" rx="38" ry="6" fill="#5a3a1a"/>
  <ellipse cx="140" cy="206" rx="38" ry="6" fill="#7a5028"/>
  <ellipse cx="140" cy="204" rx="34" ry="4" fill="#a07440"/>
  <!-- Base stem/post -->
  <rect x="134" y="190" width="12" height="14" fill="#7a5028"/>
  <path d="M 132 192 L 148 192 L 146 198 L 134 198 Z" fill="#5a3a1a" opacity="0.5"/>

  <!-- ───────── Brass meridian ring (behind sphere) ───────── -->
  <path d="M 50 100 Q 50 18, 140 18 Q 230 18, 230 100 Q 230 182, 140 195 L 140 188 Q 222 178, 222 100 Q 222 26, 140 26 Q 58 26, 58 100 Q 58 178, 140 188 L 140 195 Q 50 182, 50 100 Z"
        fill="#c9a14a"/>
  <!-- Ring degree marks -->
  <g stroke="#8a6a28" stroke-width="0.7" fill="none">
    <line x1="50"  y1="98"  x2="56"  y2="98"/>
    <line x1="50"  y1="118" x2="56"  y2="118"/>
    <line x1="52"  y1="138" x2="58"  y2="138"/>
    <line x1="56"  y1="158" x2="62"  y2="158"/>
    <line x1="224" y1="98"  x2="230" y2="98"/>
    <line x1="224" y1="118" x2="230" y2="118"/>
    <line x1="222" y1="138" x2="228" y2="138"/>
    <line x1="218" y1="158" x2="224" y2="158"/>
    <line x1="138" y1="18"  x2="138" y2="26"/>
    <line x1="138" y1="180" x2="138" y2="188"/>
  </g>

  <!-- ───────── Globe sphere (light blue oceans) ───────── -->
  <circle cx="140" cy="100" r="78" fill="#aed4ee"/>

  <!-- Latitude lines (curved horizontals) -->
  <g stroke="#5fa8d8" stroke-width="0.7" fill="none" opacity="0.55">
    <line x1="62"  y1="100" x2="218" y2="100"/>
    <ellipse cx="140" cy="100" rx="78" ry="22"/>
    <ellipse cx="140" cy="100" rx="78" ry="42"/>
    <ellipse cx="140" cy="100" rx="78" ry="60"/>
    <ellipse cx="140" cy="100" rx="78" ry="72"/>
  </g>

  <!-- Longitude lines (curved verticals) -->
  <g stroke="#5fa8d8" stroke-width="0.7" fill="none" opacity="0.55">
    <line x1="140" y1="22"  x2="140" y2="178"/>
    <ellipse cx="140" cy="100" rx="22" ry="78"/>
    <ellipse cx="140" cy="100" rx="42" ry="78"/>
    <ellipse cx="140" cy="100" rx="60" ry="78"/>
    <ellipse cx="140" cy="100" rx="72" ry="78"/>
  </g>

  <!-- ───────── Continents (stylized green/tan landmasses) ───────── -->
  <g fill="#4a9b5c">
    <!-- North America -->
    <path d="M 78 60 Q 95 52, 112 62 Q 118 75, 110 90 Q 100 96, 88 90 Q 78 80, 78 60 Z"/>
    <!-- South America -->
    <path d="M 100 105 Q 110 105, 116 118 L 112 145 Q 108 158, 100 156 Q 94 144, 96 128 Z"/>
    <!-- Europe -->
    <path d="M 138 58 Q 152 54, 162 60 Q 160 70, 150 72 Q 142 72, 136 65 Z"/>
    <!-- Africa -->
    <path d="M 144 80 Q 162 78, 168 92 L 166 122 Q 158 140, 148 138 Q 138 122, 138 100 Z"/>
    <!-- Asia -->
    <path d="M 166 56 Q 195 50, 215 64 Q 220 80, 205 88 L 178 88 Q 165 80, 162 68 Z"/>
    <!-- Australia -->
    <path d="M 188 130 Q 206 128, 214 138 Q 210 150, 196 150 Q 188 144, 188 130 Z"/>
    <!-- Greenland-ish -->
    <path d="M 118 38 Q 128 36, 134 44 Q 130 52, 122 50 Z"/>
  </g>

  <!-- Continent shadow tint for depth -->
  <g fill="#3a7a48" opacity="0.4">
    <path d="M 108 88 Q 112 96, 110 90 Z"/>
    <path d="M 164 118 Q 168 128, 158 138 L 156 130 Z"/>
  </g>

  <!-- Sphere highlight (top-left, soft sheen) -->
  <ellipse cx="108" cy="70" rx="26" ry="18" fill="#ffffff" opacity="0.30"/>
  <ellipse cx="100" cy="62" rx="10" ry="6" fill="#ffffff" opacity="0.45"/>

  <!-- Subtle bottom shadow on sphere -->
  <ellipse cx="140" cy="160" rx="68" ry="14" fill="#2e6a99" opacity="0.10"/>

  <!-- Sphere outline -->
  <circle cx="140" cy="100" r="78" fill="none" stroke="#2e6a99" stroke-width="1.2" opacity="0.5"/>
</svg>
