  <path d="M 60 118 Q 30 124, 12 132 Q 8 138, 14 140 Q 50 132, 95 130 Z" fill="#1d3160" opacity="0.5"/>

  <!-- Crown -->
  <path d="M 65 122 Q 50 60, 130 50 Q 200 55, 198 122 Q 190 130, 130 132 Q 78 132, 65 122 Z" fill="#1d3160"/>

  <!-- Panel seams -->
  <path d="M 130 50 Q 120 90, 110 130" stroke="#0e1c3e" stroke-width="1" opacity="0.5" fill="none"/>
  <path d="M 130 50 Q 150 90, 170 128" stroke="#0e1c3e" stroke-width="1" opacity="0.5" fill="none"/>
  <path d="M 130 50 Q 95 80, 70 118" stroke="#0e1c3e" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- Front logo patch -->
  <circle cx="115" cy="100" r="16" fill="#c0394a"/>
  <path d="M 108 93 L 115 108 L 122 93" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Button on top -->
