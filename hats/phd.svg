<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <title>PhD Cap</title>
  <!-- Skull cap (band fitting on head) -->
  <path d="M 55 130 Q 50 95, 120 92 Q 190 95, 185 130 Q 180 138, 165 138 L 75 138 Q 60 138, 55 130 Z" fill="#161616"/>
  <path d="M 55 130 Q 50 95, 120 92 Q 190 95, 185 130" fill="#232323"/>

  <!-- Mortarboard (flat rhombus on top) -->
  <path d="M 18 100 L 120 58 L 222 100 L 120 118 Z" fill="#0a0a0a"/>
  <path d="M 18 100 L 120 58 L 222 100" stroke="#2a2a2a" stroke-width="1" fill="none"/>

  <!-- Subtle highlight along top edge -->
  <path d="M 35 100 L 120 65 L 205 100" stroke="#3a3a3a" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- Button (gold) -->
  <circle cx="120" cy="88" r="6" fill="#d9b454"/>
  <circle cx="120" cy="88" r="3" fill="#a8862e"/>

  <!-- Tassel cord -->
  <path d="M 120 88 Q 155 92, 180 118 Q 185 128, 188 142" stroke="#d9b454" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Tassel knot -->
  <ellipse cx="188" cy="143" rx="7" ry="4" fill="#a8862e"/>

  <!-- Tassel fringe -->
  <g stroke="#d9b454" stroke-width="1.4" stroke-linecap="round">
    <line x1="183" y1="147" x2="181" y2="172"/>
    <line x1="186" y1="147" x2="185" y2="174"/>
    <line x1="188" y1="147" x2="188" y2="175"/>
    <line x1="190" y1="147" x2="191" y2="174"/>
    <line x1="193" y1="147" x2="195" y2="172"/>
  </g>
</svg>
