<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" fill="none">
  <title>Home</title>

  <!-- Ground shadow -->
  <ellipse cx="40" cy="55" rx="28" ry="2" fill="#1a2333" opacity="0.10"/>

  <!-- Chimney -->
  <rect x="56" y="14" width="6" height="10" fill="#9a3a44"/>

  <!-- Roof -->
  <path d="M 10 30 L 40 10 L 70 30 L 64 30 L 64 32 L 16 32 L 16 30 Z"
        fill="#c0394a" stroke="#7e1e2a" stroke-width="1"/>
  <!-- Roof shading -->
  <path d="M 40 10 L 70 30 L 64 30 L 64 32 L 40 32 Z"
        fill="#a32f3e" opacity="0.55"/>

  <!-- House body -->
  <rect x="16" y="32" width="48" height="20" fill="#f5f3ed" stroke="#1a2333" stroke-width="1"/>

  <!-- Door -->
  <rect x="36" y="40" width="8" height="12" fill="#7e1e2a"/>
  <circle cx="42.6" cy="46" r="0.6" fill="#c9a14a"/>

  <!-- Left window -->
  <rect x="20" y="37" width="10" height="8" fill="#aed4ee" stroke="#1a2333" stroke-width="0.8"/>
  <line x1="25" y1="37" x2="25" y2="45" stroke="#1a2333" stroke-width="0.5"/>
  <line x1="20" y1="41" x2="30" y2="41" stroke="#1a2333" stroke-width="0.5"/>

  <!-- Right window -->
  <rect x="50" y="37" width="10" height="8" fill="#aed4ee" stroke="#1a2333" stroke-width="0.8"/>
  <line x1="55" y1="37" x2="55" y2="45" stroke="#1a2333" stroke-width="0.5"/>
  <line x1="50" y1="41" x2="60" y2="41" stroke="#1a2333" stroke-width="0.5"/>
</svg>
