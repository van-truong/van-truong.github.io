<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <title>Tent with pine trees</title>

  <!-- Ground shadow under tent -->
  <ellipse cx="140" cy="150" rx="86" ry="4" fill="#3a1a08" opacity="0.18"/>

  <!-- ─── Left pine tree ─── -->
  <ellipse cx="30" cy="151" rx="22" ry="3" fill="#1a2e22" opacity="0.22"/>
  <rect x="27" y="142" width="6" height="8" fill="#3a1a08"/>
  <!-- Bottom tier (widest) -->
  <path d="M 30 96 L 8 144 L 52 144 Z" fill="#2d6041"/>
  <!-- Middle tier -->
  <path d="M 30 76 L 12 116 L 48 116 Z" fill="#386641"/>
  <!-- Top tier -->
  <path d="M 30 56 L 16 90 L 44 90 Z" fill="#4a7d56"/>
  <!-- Highlight stripe -->
  <path d="M 30 56 L 30 140" stroke="#1f4a2e" stroke-width="0.7" opacity="0.4"/>

  <!-- ─── Right pine tree (slightly taller) ─── -->
  <ellipse cx="250" cy="151" rx="24" ry="3.5" fill="#1a2e22" opacity="0.22"/>
  <rect x="247" y="143" width="6" height="8" fill="#3a1a08"/>
  <!-- Bottom tier (widest) -->
  <path d="M 250 92 L 226 145 L 274 145 Z" fill="#2d6041"/>
  <!-- Middle tier -->
  <path d="M 250 70 L 230 114 L 270 114 Z" fill="#386641"/>
  <!-- Top tier -->
  <path d="M 250 48 L 234 86 L 266 86 Z" fill="#4a7d56"/>
  <!-- Highlight stripe -->
  <path d="M 250 48 L 250 142" stroke="#1f4a2e" stroke-width="0.7" opacity="0.4"/>

  <!-- Guy lines (rope lines from peak to ground stakes) -->
  <line x1="151" y1="55" x2="200" y2="147" stroke="#6a2430" stroke-width="0.9" opacity="0.55" stroke-dasharray="2 2.5"/>
  <line x1="129" y1="55" x2="80" y2="147" stroke="#6a2430" stroke-width="0.9" opacity="0.55" stroke-dasharray="2 2.5"/>

  <!-- Tent body — back panel (darker, peeks at edges) -->
  <path d="M 140 36 L 224 148 L 56 148 Z" fill="#96303e"/>

  <!-- Tent body — main A-frame -->
  <path d="M 140 40 L 218 146 L 62 146 Z" fill="#c0394a"/>

  <!-- Side panel shading (right side slightly darker for depth) -->
  <path d="M 140 40 L 218 146 L 140 146 Z" fill="#96303e" opacity="0.35"/>

  <!-- Door opening (V-shape) -->
  <path d="M 140 64 L 118 146 L 162 146 Z" fill="#3d1019"/>

  <!-- Door flap (rolled back on the left) -->
  <path d="M 140 64 L 120 146 L 132 146 L 142 92 Z" fill="#e08a97" opacity="0.78"/>

  <!-- Peak ridge highlight -->
  <line x1="140" y1="40" x2="140" y2="92" stroke="#eba7b0" stroke-width="1.8" opacity="0.6"/>

  <!-- Pole / flagpole rising from peak -->
  <line x1="140" y1="40" x2="140" y2="20" stroke="#3a1a08" stroke-width="1.6"/>

  <!-- Pennant flag (red — matches the site's red accent) -->
  <path d="M 140 20 L 158 25 L 140 31 Z" fill="#2e5c8a"/>

  <!-- Tent stakes -->
  <circle cx="62" cy="147" r="2.2" fill="#3a1a08"/>
  <circle cx="218" cy="147" r="2.2" fill="#3a1a08"/>

  <!-- Tiny stitched seam along the ridge -->
  <path d="M 140 44 Q 140 90, 140 140" stroke="#6a2430" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.4" fill="none"/>
</svg>
