<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <title>Floppy Traveler Bucket Hat with Globe Patch</title>

  <!-- ─── Brim back (under-layer, droops wide and low for floppy feel) ─── -->
  <path d="M -2 118
           Q 50 102, 100 112
           Q 140 120, 180 112
           Q 230 102, 282 118
           Q 250 168, 140 168
           Q 30 168, -2 118 Z"
        fill="#3a6a95"/>

  <!-- ─── Brim front (visible upper surface, slightly higher and narrower) ─── -->
  <path d="M 8 116
           Q 58 100, 108 110
           Q 140 117, 172 110
           Q 222 100, 272 116
           Q 230 158, 140 160
           Q 50 158, 8 116 Z"
        fill="#5b8db8"/>

  <!-- ─── Brim wavy edge highlight (suggests soft floppy fabric) ─── -->
  <path d="M 10 118
           Q 60 102, 110 114
           Q 140 120, 170 114
           Q 220 102, 270 118"
        stroke="#a8cce4" stroke-width="1.2" fill="none" opacity="0.55"/>

  <!-- ─── Crown (relaxed dome) ─── -->
  <path d="M 72 116
           Q 56 55, 140 50
           Q 224 55, 208 116 Z"
        fill="#7aa9ce"/>

  <!-- Top highlight -->
  <ellipse cx="134" cy="66" rx="58" ry="11" fill="#a8cce4" opacity="0.65"/>

  <!-- Hat band -->
  <path d="M 76 105 Q 140 122, 204 105 L 202 114 Q 140 130, 78 114 Z"
        fill="#1f3f63"/>

  <!-- Band buckle -->
  <rect x="150" y="110" width="10" height="6" rx="1" fill="#c9a14a"/>

  <!-- Soft vertical seam stitches on crown (panel hint) -->
  <g stroke="#3a6a95" stroke-width="0.6" stroke-dasharray="2 2" fill="none" opacity="0.4">
    <path d="M 90 110 Q 88 80, 94 56"/>
    <path d="M 188 110 Q 190 80, 184 56"/>
  </g>

  <!-- Floppy brim edge stitching (follows the wavy droop) -->
  <path d="M 8 132
           Q 60 168, 140 168
           Q 220 168, 272 132"
        stroke="#1f3f63" stroke-width="0.8" stroke-dasharray="3 3" fill="none" opacity="0.5"/>

  <!-- Subtle brim crease (where soft fabric folds at sides) -->
  <path d="M 30 130 Q 70 148, 110 138"
        stroke="#2e547a" stroke-width="0.7" fill="none" opacity="0.35"/>
  <path d="M 170 138 Q 210 148, 250 130"
        stroke="#2e547a" stroke-width="0.7" fill="none" opacity="0.35"/>

  <!-- ───────── Globe sticker / patch (front center) ───────── -->
  <g transform="translate(140, 86)">
    <!-- Patch white border -->
    <circle cx="0" cy="0" r="22" fill="#f5f3ed" stroke="#1f3f63" stroke-width="1.2"/>
    <!-- Stitched edge -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#1f3f63" stroke-width="0.5" stroke-dasharray="1.5 1.5" opacity="0.7"/>

    <!-- Globe sphere -->
    <circle cx="0" cy="0" r="17" fill="#aed4ee"/>

    <!-- Latitude lines -->
    <g stroke="#5fa8d8" stroke-width="0.45" fill="none" opacity="0.65">
      <line x1="-17" y1="0" x2="17" y2="0"/>
      <ellipse cx="0" cy="0" rx="17" ry="6"/>
      <ellipse cx="0" cy="0" rx="17" ry="12"/>
    </g>
    <!-- Longitude lines -->
    <g stroke="#5fa8d8" stroke-width="0.45" fill="none" opacity="0.65">
      <line x1="0" y1="-17" x2="0" y2="17"/>
      <ellipse cx="0" cy="0" rx="6" ry="17"/>
      <ellipse cx="0" cy="0" rx="12" ry="17"/>
    </g>

    <!-- Stylized continents -->
    <g fill="#4a9b5c">
      <path d="M -11 -8 Q -7 -10, -4 -6 Q -3 -1, -7 2 Q -10 1, -12 -4 Z"/>
      <path d="M -7 4 Q -4 4, -3 8 L -5 12 Q -8 11, -8 7 Z"/>
      <path d="M 1 -7 Q 6 -8, 8 -3 Q 7 4, 3 6 Q -1 4, 0 -2 Z"/>
      <path d="M 5 -10 Q 11 -11, 14 -7 Q 13 -3, 9 -3 Q 5 -5, 5 -10 Z"/>
      <path d="M 9 7 Q 13 6, 14 10 Q 12 12, 9 11 Z"/>
    </g>

    <!-- Highlight -->
    <ellipse cx="-6" cy="-6" rx="5" ry="3.5" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
