<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <title>Cowboy Hat</title>

  <!-- Brim back/underside (darker, peeks at edges) -->
  <path d="M 8 118 Q 38 80, 72 110 Q 106 130, 140 132 Q 174 130, 208 110 Q 242 80, 272 118 L 268 126 Q 200 144, 140 144 Q 80 144, 12 126 Z"
        fill="#6e4a26"/>

  <!-- Brim top layer (lighter brown — iconic upturned wings) -->
  <path d="M 12 115 Q 40 82, 74 110 Q 106 128, 140 130 Q 174 128, 206 110 Q 240 82, 268 115 L 264 122 Q 200 140, 140 140 Q 80 140, 16 122 Z"
        fill="#9a7040"/>

  <!-- Crown -->
  <path d="M 92 124 Q 82 56, 108 42 Q 125 35, 140 36 Q 155 35, 172 42 Q 198 56, 188 124 Z"
        fill="#a87a48"/>

  <!-- Crown top highlight -->
  <path d="M 110 50 Q 130 40, 152 44 Q 165 50, 160 58 Q 130 52, 112 60 Q 105 54, 110 50 Z"
        fill="#bf8e5a" opacity="0.55"/>

  <!-- Center crease (the iconic top pinch) -->
  <path d="M 140 38 Q 138 65, 140 95" stroke="#6e4a26" stroke-width="2.5" fill="none" opacity="0.5"/>

  <!-- Left side dent -->
  <path d="M 118 50 Q 124 62, 122 78" stroke="#6e4a26" stroke-width="1.8" fill="none" opacity="0.4"/>

  <!-- Right side dent -->
  <path d="M 162 50 Q 156 62, 158 78" stroke="#6e4a26" stroke-width="1.8" fill="none" opacity="0.4"/>

  <!-- Hat band -->
  <path d="M 94 112 Q 140 126, 186 112 L 184 122 Q 140 134, 96 122 Z"
        fill="#3a2410"/>

  <!-- Silver concho on band -->
  <circle cx="172" cy="118" r="3.5" fill="#c8b07a"/>
  <circle cx="172" cy="118" r="1.5" fill="#8a7048"/>

  <!-- Stitching along brim edge -->
  <path d="M 20 120 Q 100 140, 140 142 Q 180 140, 260 120"
        stroke="#5a3818" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.5" fill="none"/>
</svg>
