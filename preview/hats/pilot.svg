<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <title>Pilot Cap</title>

  <!-- Visor / peak shadow (deepest layer) -->
  <ellipse cx="140" cy="152" rx="96" ry="11" fill="#070716"/>

  <!-- Visor top surface -->
  <path d="M 46 142 Q 90 156, 140 158 Q 190 156, 234 142 L 232 150 Q 190 161, 140 163 Q 90 161, 48 150 Z"
        fill="#15152a"/>

  <!-- Scrambled-egg gold embroidery on visor -->
  <path d="M 64 148 Q 102 156, 140 157 Q 178 156, 216 148"
        stroke="#d4a857" stroke-width="2.2" fill="none"/>
  <path d="M 78 152 Q 110 158, 140 159 Q 170 158, 202 152"
        stroke="#c08e3b" stroke-width="1.3" fill="none"/>
  <circle cx="92"  cy="151" r="1.4" fill="#d4a857"/>
  <circle cx="108" cy="153" r="1.2" fill="#d4a857"/>
  <circle cx="172" cy="153" r="1.2" fill="#d4a857"/>
  <circle cx="188" cy="151" r="1.4" fill="#d4a857"/>

  <!-- White hat band -->
  <path d="M 52 110 Q 92 128, 140 130 Q 188 128, 228 110 L 230 126 Q 188 144, 140 146 Q 92 144, 50 126 Z"
        fill="#f5f3ed"/>
  <!-- Band shadow underline -->
  <path d="M 52 142 Q 92 148, 140 149 Q 188 148, 228 142 L 226 146 Q 188 152, 140 153 Q 92 152, 54 146 Z"
        fill="#cfccc0" opacity="0.5"/>

  <!-- Crown (rounded, high in front, deep navy) -->
  <path d="M 52 112 Q 32 64, 70 40 Q 104 26, 140 24 Q 176 26, 210 40 Q 248 64, 228 112 Z"
        fill="#0f0f2e"/>

  <!-- Front raised "high crown" shading -->
  <path d="M 72 96 Q 100 50, 140 46 Q 180 50, 208 96 L 212 112 Q 180 116, 140 114 Q 100 116, 68 112 Z"
        fill="#191942" opacity="0.85"/>

  <!-- Crown top highlight -->
  <path d="M 86 54 Q 130 36, 178 48"
        stroke="#2a2a55" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 100 42 Q 130 32, 160 38"
        stroke="#3a3a6a" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Wings emblem on white band -->
  <g transform="translate(140, 124)">
    <!-- Center shield -->
    <path d="M -5 -8 L 0 -10 L 5 -8 L 5 4 L 0 9 L -5 4 Z" fill="#c9a14a"/>
    <path d="M -4 -7 L 0 -8.5 L 4 -7 L 4 3 L 0 7 L -4 3 Z" fill="#a8842f"/>
    <!-- Star on shield -->
    <path d="M 0 -4 L 1 -1 L 4 -1 L 1.5 1 L 2.5 4 L 0 2 L -2.5 4 L -1.5 1 L -4 -1 L -1 -1 Z"
          fill="#f4d068"/>

    <!-- Left wing - feathered strokes -->
    <path d="M -5 -2 Q -12 -5, -22 -4 Q -30 -3, -38 -1 Q -30 1, -20 2 Q -12 3, -5 2 Z"
          fill="#d4a857"/>
    <path d="M -12 -3 Q -22 -4, -30 -3" stroke="#8a6a28" stroke-width="0.6" fill="none"/>
    <path d="M -14 -1 Q -24 -1, -32 0"  stroke="#8a6a28" stroke-width="0.6" fill="none"/>
    <path d="M -10 1 Q -20 2, -28 2"    stroke="#8a6a28" stroke-width="0.5" fill="none"/>

    <!-- Right wing - feathered strokes -->
    <path d="M 5 -2 Q 12 -5, 22 -4 Q 30 -3, 38 -1 Q 30 1, 20 2 Q 12 3, 5 2 Z"
          fill="#d4a857"/>
    <path d="M 12 -3 Q 22 -4, 30 -3" stroke="#8a6a28" stroke-width="0.6" fill="none"/>
    <path d="M 14 -1 Q 24 -1, 32 0"  stroke="#8a6a28" stroke-width="0.6" fill="none"/>
    <path d="M 10 1 Q 20 2, 28 2"    stroke="#8a6a28" stroke-width="0.5" fill="none"/>
  </g>
</svg>
