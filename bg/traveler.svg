<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380">
  <defs>
    <style>
      .line { stroke: #2e6a99; fill: none; stroke-width: 1; }
      .thick { stroke: #2e6a99; fill: none; stroke-width: 1.3; }
      .fill { fill: #2e6a99; }
      .soft { stroke: #5fa8d8; fill: none; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- Latitude/longitude lines (very faint world-map vibe) -->
  <g opacity="0.10">
    <ellipse cx="190" cy="190" rx="170" ry="80"  class="line"/>
    <ellipse cx="190" cy="190" rx="170" ry="120" class="line"/>
    <ellipse cx="190" cy="190" rx="170" ry="160" class="line"/>
    <ellipse cx="190" cy="190" rx="80"  ry="170" class="line"/>
    <ellipse cx="190" cy="190" rx="130" ry="170" class="line"/>
  </g>

  <!-- Compass rose (top-left) -->
  <g transform="translate(70,70)" opacity="0.22">
    <circle cx="0" cy="0" r="22" class="line"/>
    <circle cx="0" cy="0" r="16" class="line"/>
    <path d="M 0 -22 L 4 0 L 0 22 L -4 0 Z" class="fill"/>
    <path d="M -22 0 L 0 -4 L 22 0 L 0 4 Z" class="fill"/>
    <text x="-3" y="-26" font-size="7" font-family="serif" class="fill" stroke="none">N</text>
  </g>

  <!-- Cute airplane with dotted trail (top-center) -->
  <g transform="translate(180,55) rotate(-12)" opacity="0.22">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="16" ry="3.2" class="fill"/>
    <!-- Wings -->
    <path d="M -2 -1.5 L -10 -10 L -3 -1.5 Z" class="fill"/>
    <path d="M -2 1.5 L -10 10 L -3 1.5 Z" class="fill"/>
    <!-- Tail fin -->
    <path d="M -13 -1 L -16 -6 L -11 -1 Z" class="fill"/>
    <path d="M -13 1 L -16 6 L -11 1 Z" class="fill"/>
    <!-- Window dots -->
    <circle cx="6" cy="0" r="0.7" fill="#fff"/>
    <circle cx="3" cy="0" r="0.7" fill="#fff"/>
    <circle cx="0" cy="0" r="0.7" fill="#fff"/>
    <!-- Dotted trail behind -->
    <path d="M -20 0 L -52 -2" class="line" stroke-dasharray="2 2.5" stroke-width="1"/>
  </g>

  <!-- Larger plane silhouette (top-right) -->
  <g transform="translate(305,90) rotate(35)" opacity="0.18">
    <path d="M 0 0 L 22 -2 L 28 0 L 22 2 L 0 0 Z M 8 0 L 4 -10 L 6 -10 L 12 0 M 8 0 L 4 10 L 6 10 L 12 0 M 18 0 L 16 -5 L 18 -5 L 20 0 M 18 0 L 16 5 L 18 5 L 20 0" class="fill"/>
  </g>

  <!-- Cute train (mid-center) -->
  <g transform="translate(140,170)" opacity="0.20">
    <!-- Tracks -->
    <line x1="-12" y1="14" x2="58" y2="14" class="line" stroke-width="0.8"/>
    <g stroke="#2e6a99" stroke-width="0.6">
      <line x1="-8" y1="12" x2="-8" y2="16"/>
      <line x1="0" y1="12" x2="0" y2="16"/>
      <line x1="10" y1="12" x2="10" y2="16"/>
      <line x1="20" y1="12" x2="20" y2="16"/>
      <line x1="30" y1="12" x2="30" y2="16"/>
      <line x1="40" y1="12" x2="40" y2="16"/>
      <line x1="50" y1="12" x2="50" y2="16"/>
    </g>
    <!-- Locomotive body -->
    <rect x="0" y="-2" width="36" height="12" class="thick"/>
    <!-- Cabin (back of loco) -->
    <rect x="0" y="-12" width="14" height="10" class="thick"/>
    <!-- Cabin window -->
    <rect x="3" y="-9" width="8" height="4" class="line" stroke-width="0.6"/>
    <!-- Smokestack -->
    <rect x="20" y="-10" width="4" height="8" class="thick"/>
    <!-- Front "cowcatcher" hint -->
    <path d="M 36 -2 L 42 4 L 36 10 Z" class="line"/>
    <!-- Wheels -->
    <circle cx="6"  cy="10" r="3" class="thick"/>
    <circle cx="18" cy="10" r="4" class="thick"/>
    <circle cx="30" cy="10" r="3" class="thick"/>
    <!-- Steam puffs -->
    <circle cx="22" cy="-15" r="2.5" class="soft"/>
    <circle cx="26" cy="-20" r="3.2" class="soft"/>
    <circle cx="32" cy="-23" r="2.4" class="soft"/>
  </g>

  <!-- Passport stamp (mid-left, circular) -->
  <g transform="translate(60,235)" opacity="0.18">
    <circle cx="0" cy="0" r="28" class="line" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" class="line" stroke-width="0.7" stroke-dasharray="3 2"/>
    <text x="-22" y="-6" font-size="6" font-family="serif" class="fill" stroke="none" letter-spacing="1">VISA</text>
    <text x="-18" y="6" font-size="5" font-family="serif" class="fill" stroke="none" letter-spacing="0.5">2024 · 2025</text>
    <path d="M -10 -2 L 10 2" class="line" stroke-width="0.6"/>
  </g>

  <!-- Cute sailboat (mid-right) -->
  <g transform="translate(270,225)" opacity="0.20">
    <!-- Mast -->
    <line x1="-2" y1="-2" x2="-2" y2="-26" class="thick"/>
    <!-- Main sail -->
    <path d="M -2 -25 L 14 -2 L -2 -2 Z" class="thick"/>
    <!-- Jib sail -->
    <path d="M -2 -22 L -14 -2 L -2 -2 Z" class="thick"/>
    <!-- Hull -->
    <path d="M -20 -2 Q 0 8, 20 -2 L 14 4 Q 0 10, -14 4 Z" class="fill"/>
    <!-- Water waves -->
    <path d="M -28 8 Q -22 6, -16 8 T -4 8 T 8 8 T 20 8 T 28 8" class="soft"/>
    <path d="M -30 13 Q -24 11, -18 13 T -6 13 T 6 13 T 18 13 T 30 13" class="soft"/>
  </g>

  <!-- Sailboat #2 (smaller, bottom-left) -->
  <g transform="translate(145,310)" opacity="0.18">
    <line x1="-1" y1="-1" x2="-1" y2="-18" class="line" stroke-width="0.9"/>
    <path d="M -1 -17 L 9 -1 L -1 -1 Z" class="line"/>
    <path d="M -1 -15 L -9 -1 L -1 -1 Z" class="line"/>
    <path d="M -13 -1 Q 0 5, 13 -1 L 9 3 Q 0 7, -9 3 Z" class="fill"/>
    <path d="M -18 6 Q -14 4, -10 6 T -2 6 T 6 6 T 14 6 T 18 6" class="soft"/>
  </g>

  <!-- Suitcase (bottom-right) -->
  <g transform="translate(305,300)" opacity="0.17">
    <rect x="-18" y="-12" width="36" height="24" rx="2" class="line"/>
    <line x1="-18" y1="-4" x2="18" y2="-4" class="line"/>
    <path d="M -6 -12 L -6 -16 L 6 -16 L 6 -12" class="line"/>
    <rect x="-3" y="-7" width="6" height="3" class="fill"/>
  </g>

  <!-- Tiny airplane (zooming across, bottom-center) -->
  <g transform="translate(60,150) rotate(20)" opacity="0.18">
    <ellipse cx="0" cy="0" rx="10" ry="2" class="fill"/>
    <path d="M -1 -1 L -6 -5 L -2 -1 Z" class="fill"/>
    <path d="M -1 1 L -6 5 L -2 1 Z" class="fill"/>
    <path d="M -8 -1 L -10 -3 L -7 -1 Z" class="fill"/>
    <path d="M -8 1 L -10 3 L -7 1 Z" class="fill"/>
    <path d="M -12 0 L -26 -1" class="line" stroke-dasharray="1.5 2" stroke-width="0.8"/>
  </g>

  <!-- Tiny scattered dots (cities on a map) -->
  <g class="fill" opacity="0.30">
    <circle cx="150" cy="40" r="1.6"/>
    <circle cx="240" cy="180" r="1.6"/>
    <circle cx="120" cy="320" r="1.6"/>
    <circle cx="340" cy="220" r="1.6"/>
    <circle cx="200" cy="270" r="1.6"/>
    <circle cx="50" cy="350" r="1.4"/>
  </g>

  <!-- Dotted travel route between two cities -->
  <path d="M 150 40 Q 200 130, 240 180" stroke="#2e6a99" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.22" fill="none"/>
</svg>
