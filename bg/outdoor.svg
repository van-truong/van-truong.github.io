    <path d="M 270 50 Q 295 35, 320 50 Q 328 75, 320 100 Q 295 110, 270 100 Q 262 75, 270 50 Z" class="contour"/>
    <path d="M 258 38 Q 295 20, 332 38 Q 345 75, 332 115 Q 295 130, 258 115 Q 245 75, 258 38 Z" class="contour"/>
  </g>

  <!-- Bottom left small hill -->
  <g opacity="0.13">
    <path d="M 50 320 Q 65 312, 80 320 Q 85 332, 80 344 Q 65 350, 50 344 Q 45 332, 50 320 Z" class="contour"/>
    <path d="M 38 310 Q 65 298, 92 310 Q 100 332, 92 354 Q 65 364, 38 354 Q 30 332, 38 310 Z" class="contour"/>
  </g>

  <!-- Tiny pine sprigs scattered -->
  <g stroke="#3d5232" stroke-width="1.2" opacity="0.2" fill="none">
    <g transform="translate(220, 60)">
      <line x1="0" y1="0" x2="0" y2="14"/>
      <line x1="0" y1="3" x2="-4" y2="6"/>
      <line x1="0" y1="3" x2="4" y2="6"/>
      <line x1="0" y1="7" x2="-3" y2="10"/>
      <line x1="0" y1="7" x2="3" y2="10"/>
    </g>
    <g transform="translate(370, 180)">
      <line x1="0" y1="0" x2="0" y2="14"/>
      <line x1="0" y1="3" x2="-4" y2="6"/>
      <line x1="0" y1="3" x2="4" y2="6"/>
      <line x1="0" y1="7" x2="-3" y2="10"/>
      <line x1="0" y1="7" x2="3" y2="10"/>
    </g>
    <g transform="translate(160, 360)">
      <line x1="0" y1="0" x2="0" y2="14"/>
      <line x1="0" y1="3" x2="-4" y2="6"/>
      <line x1="0" y1="3" x2="4" y2="6"/>
      <line x1="0" y1="7" x2="-3" y2="10"/>
      <line x1="0" y1="7" x2="3" y2="10"/>
    </g>
  </g>

  <!-- Small compass rose (faded, decorative) -->
  <g transform="translate(360, 50)" opacity="0.18" stroke="#3d5232" fill="none" stroke-width="0.8">
    <circle cx="0" cy="0" r="10"/>
    <line x1="0" y1="-12" x2="0" y2="12"/>
    <line x1="-12" y1="0" x2="12" y2="0"/>
    <text x="-2" y="-14" font-size="6" font-family="serif" fill="#3d5232" stroke="none">N</text>
  </g>
</svg>
