<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      .contour { fill: none; stroke: #3d5232; stroke-width: 1; }
    </style>
  </defs>

  <!-- Mountain peak 1 (concentric closed contour lines) -->
  <g opacity="0.16">
    <path d="M 95 110 Q 115 95, 135 110 Q 145 130, 135 150 Q 115 165, 95 150 Q 85 130, 95 110 Z" class="contour"/>
    <path d="M 80 95 Q 115 75, 150 95 Q 165 130, 150 165 Q 115 185, 80 165 Q 65 130, 80 95 Z" class="contour"/>
    <path d="M 65 80 Q 115 55, 165 80 Q 185 130, 165 180 Q 115 205, 65 180 Q 45 130, 65 80 Z" class="contour"/>
    <path d="M 50 65 Q 115 35, 180 65 Q 205 130, 180 195 Q 115 225, 50 195 Q 25 130, 50 65 Z" class="contour"/>
    <path d="M 35 50 Q 115 15, 195 50 Q 225 130, 195 210 Q 115 245, 35 210 Q 5 130, 35 50 Z" class="contour"/>
  </g>

  <!-- Mountain peak 2 (bottom right) -->
  <g opacity="0.14">
    <path d="M 290 290 Q 305 280, 320 290 Q 327 305, 320 320 Q 305 327, 290 320 Q 283 305, 290 290 Z" class="contour"/>
    <path d="M 278 278 Q 305 265, 332 278 Q 342 305, 332 332 Q 305 342, 278 332 Q 268 305, 278 278 Z" class="contour"/>
    <path d="M 265 265 Q 305 245, 345 265 Q 360 305, 345 345 Q 305 360, 265 345 Q 250 305, 265 265 Z" class="contour"/>
    <path d="M 250 250 Q 305 225, 360 250 Q 380 305, 360 360 Q 305 380, 250 360 Q 230 305, 250 250 Z" class="contour"/>
  </g>

  <!-- Small valley (top right) -->
  <g opacity="0.12">
