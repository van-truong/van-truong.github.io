<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 340 340">
  <defs>
    <style>
      .ink { fill: #134e4a; }
      .stroke { stroke: #134e4a; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Heart icon -->
  <g transform="translate(60,55)" opacity="0.17">
    <path d="M 0 8 C -10 -4, 8 -10, 8 2 C 8 -10, 26 -4, 16 8 L 8 16 Z" class="ink"/>
  </g>

  <!-- Speech bubble -->
  <g transform="translate(230,60)" opacity="0.16">
    <path d="M 0 0 Q 0 -12, 14 -12 L 26 -12 Q 40 -12, 40 0 Q 40 12, 26 12 L 18 12 L 12 18 L 14 12 Q 0 12, 0 0 Z" class="stroke"/>
    <circle cx="14" cy="0" r="1.3" class="ink"/>
    <circle cx="20" cy="0" r="1.3" class="ink"/>
    <circle cx="26" cy="0" r="1.3" class="ink"/>
  </g>

  <!-- Hashtag -->
  <g transform="translate(285,170)" opacity="0.18">
    <line x1="-10" y1="-6" x2="-6" y2="10" class="stroke"/>
    <line x1="2" y1="-6" x2="6" y2="10" class="stroke"/>
    <line x1="-14" y1="-2" x2="10" y2="-2" class="stroke"/>
    <line x1="-12" y1="6" x2="12" y2="6" class="stroke"/>
  </g>

  <!-- Play triangle -->
  <g transform="translate(70,230)" opacity="0.17">
    <circle cx="0" cy="0" r="14" class="stroke"/>
    <path d="M -4 -6 L 8 0 L -4 6 Z" class="ink"/>
  </g>

  <!-- WiFi arcs -->
  <g transform="translate(180,40)" opacity="0.14">
    <path d="M -14 4 Q 0 -8, 14 4" class="stroke"/>
    <path d="M -10 8 Q 0 0, 10 8" class="stroke"/>
    <path d="M -5 12 Q 0 8, 5 12" class="stroke"/>
    <circle cx="0" cy="14" r="1.5" class="ink"/>
  </g>

  <!-- Notification bell -->
  <g transform="translate(150,260)" opacity="0.15">
    <path d="M -8 -2 Q -8 -12, 0 -12 Q 8 -12, 8 -2 L 9 5 L -9 5 Z" class="stroke"/>
    <path d="M -3 5 Q 0 9, 3 5" class="stroke"/>
    <circle cx="8" cy="-9" r="2.5" fill="#14b8a6" opacity="0.7"/>
  </g>

  <!-- Camera -->
  <g transform="translate(260,290)" opacity="0.15">
    <rect x="-12" y="-7" width="24" height="14" rx="2" class="stroke"/>
    <circle cx="0" cy="0" r="4" class="stroke"/>
    <circle cx="0" cy="0" r="1.3" class="ink"/>
  </g>

  <!-- Refresh / scroll loop -->
  <g transform="translate(110,150)" opacity="0.14">
    <path d="M -10 0 A 10 10 0 1 1 0 10" class="stroke"/>
    <path d="M -10 0 L -14 -3 L -8 -3 Z" class="ink"/>
  </g>

  <!-- Tiny scattered notification dots -->
  <g fill="#14b8a6" opacity="0.40">
    <circle cx="40" cy="140" r="1.5"/>
    <circle cx="200" cy="200" r="1.5"/>
    <circle cx="280" cy="100" r="1.3"/>
    <circle cx="320" cy="240" r="1.5"/>
    <circle cx="25" cy="290" r="1.3"/>
  </g>

  <!-- Faint feed lines (suggests scrolling content) -->
  <g class="stroke" opacity="0.07" stroke-width="2">
    <line x1="130" y1="100" x2="200" y2="100"/>
    <line x1="130" y1="108" x2="180" y2="108"/>
    <line x1="200" y1="120" x2="270" y2="120"/>
    <line x1="200" y1="128" x2="250" y2="128"/>
  </g>
</svg>
