<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <style>
      .stroke { stroke: #c63678; fill: none; stroke-width: 0.8; }
      .fill { fill: #c63678; }
      .mono { font-family: 'Courier New', monospace; fill: #c63678; }
    </style>
  </defs>

  <!-- Atom (top-left) -->
  <g transform="translate(50,60)" opacity="0.13">
    <circle cx="0" cy="0" r="2.5" class="fill"/>
    <ellipse cx="0" cy="0" rx="18" ry="6" class="stroke" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="18" ry="6" class="stroke" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="18" ry="6" class="stroke" transform="rotate(-60)"/>
    <circle cx="18" cy="0" r="1.5" class="fill"/>
    <circle cx="-9" cy="15.6" r="1.5" class="fill"/>
    <circle cx="-9" cy="-15.6" r="1.5" class="fill"/>
  </g>

  <!-- DNA helix (right side) -->
  <g transform="translate(240,40)" opacity="0.12">
    <path d="M 0 0 Q 12 6, 0 12 Q -12 18, 0 24 Q 12 30, 0 36 Q -12 42, 0 48" class="stroke"/>
    <path d="M 0 0 Q -12 6, 0 12 Q 12 18, 0 24 Q -12 30, 0 36 Q 12 42, 0 48" class="stroke"/>
    <line x1="-6" y1="3" x2="6" y2="3" class="stroke"/>
    <line x1="-6" y1="9" x2="6" y2="9" class="stroke"/>
    <line x1="-6" y1="15" x2="6" y2="15" class="stroke"/>
    <line x1="-6" y1="21" x2="6" y2="21" class="stroke"/>
    <line x1="-6" y1="27" x2="6" y2="27" class="stroke"/>
    <line x1="-6" y1="33" x2="6" y2="33" class="stroke"/>
    <line x1="-6" y1="39" x2="6" y2="39" class="stroke"/>
    <line x1="-6" y1="45" x2="6" y2="45" class="stroke"/>
  </g>

  <!-- Plot curve with axes (middle-bottom-left) -->
  <g transform="translate(30,200)" opacity="0.12">
    <line x1="0" y1="0" x2="0" y2="-50" class="stroke"/>
    <line x1="0" y1="0" x2="70" y2="0" class="stroke"/>
    <path d="M 2 -2 Q 20 -12, 35 -25 Q 50 -40, 68 -45" class="stroke"/>
    <circle cx="15" cy="-9" r="1.3" class="fill"/>
    <circle cx="30" cy="-22" r="1.3" class="fill"/>
    <circle cx="50" cy="-38" r="1.3" class="fill"/>
    <text x="35" y="10" font-size="6" class="mono">x</text>
    <text x="-10" y="-25" font-size="6" class="mono">y</text>
  </g>

  <!-- Equation snippet -->
  <g opacity="0.13">
    <text x="180" y="170" font-size="11" class="mono">∂y / ∂x = ƒ(x)</text>
  </g>

  <!-- Equation snippet 2 -->
  <g opacity="0.13">
    <text x="50" y="290" font-size="10" class="mono">P(A|B) = P(B|A)P(A) / P(B)</text>
  </g>

  <!-- Small benzene ring (bottom right) -->
  <g transform="translate(250,240)" opacity="0.12">
    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" class="stroke"/>
    <circle cx="0" cy="0" r="6" class="stroke"/>
  </g>

  <!-- Schrödinger wave (top center) -->
  <g transform="translate(140,30)" opacity="0.11">
    <path d="M 0 0 Q 6 -8, 12 0 T 24 0 T 36 0 T 48 0 T 60 0" class="stroke"/>
    <text x="2" y="15" font-size="8" class="mono">ψ(x,t)</text>
  </g>
</svg>
